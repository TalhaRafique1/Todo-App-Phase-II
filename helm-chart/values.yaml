# Default values for todo-app
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

frontend:
  replicaCount: 1
  image:
    repository: frontend-app-original
    pullPolicy: IfNotPresent  # Use local images in minikube
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  service:
    type: NodePort  # Changed to NodePort for local access
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: localhost
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

backend:
  replicaCount: 1
  image:
    repository: backend-app-original
    pullPolicy: IfNotPresent  # Use local images in minikube
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  service:
    type: ClusterIP  # Keep backend as ClusterIP, only accessible internally
    port: 8000
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database configuration
database:
  type: sqlite
  # If using postgres, uncomment below
  # type: postgres
  # host: postgres-service
  # port: 5432
  # user: postgres
  # password: ""
  # name: todoapp